version: '3.9'

services:
  # ─── PostgreSQL 16 ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clearos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clearos
      POSTGRES_USER: clearos
      POSTGRES_PASSWORD: clearos_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clearos -d clearos']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clearos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # ─── MinIO (S3-compatible object storage) ───────────────
  minio:
    image: minio/minio:latest
    container_name: clearos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'   # API
      - '9001:9001'   # Console
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    name: clearos-pgdata
  redisdata:
    name: clearos-redisdata
  miniodata:
    name: clearos-miniodata
